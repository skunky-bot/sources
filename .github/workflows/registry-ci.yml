name: registry-test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  registry-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_registry.py
